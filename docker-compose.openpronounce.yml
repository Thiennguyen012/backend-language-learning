services:
  openpronounce:
    build:
      context: ./openpronounce-service
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - openpronounce-models:/models
    environment:
      SPEAKING_LEVEL_ASR_MODEL: ${SPEAKING_LEVEL_ASR_MODEL:-small.en}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama-model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  openpronounce-models:
  ollama-models:
